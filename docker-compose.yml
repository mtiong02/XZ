version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: xz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - xz-db-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro

  gotrue:
    image: supabase/gotrue:v2.132.3
    container_name: xz-gotrue
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      API_EXTERNAL_URL: https://busybeeenglish.site/auth
      GOTRUE_API_EXTERNAL_URL: https://busybeeenglish.site/auth
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/postgres
      GOTRUE_DB_DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/postgres
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SITE_URL: https://busybeeenglish.site
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_JWT_SECRET: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_LOG_LEVEL: info
    depends_on:
      - db

  speech:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xz-speech
    restart: unless-stopped
    command: ["pnpm", "--filter", "@xz/speech", "start"]
    volumes:
      - ./local-models:/app/local-models:ro
    ports:
      - "6010:6010"
    environment:
      - NODE_ENV=production
      - SPEECH_PORT=6010
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:?MINIMAX_API_KEY is required}
      - MINIMAX_REALTIME_MODEL=${MINIMAX_REALTIME_MODEL:-abab6.5s-chat}
      - MINIMAX_REALTIME_VOICE=${MINIMAX_REALTIME_VOICE:-female-shaonv}
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN is required}
    cpus: 2.0
    mem_limit: 3g

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xz-web
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      - NODE_ENV=production
    cpus: 0.5
    mem_limit: 768m

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xz-api
    restart: unless-stopped
    command: ["pnpm", "--filter", "@xz/api", "start"]
    ports:
      - "4100:4000"
    environment:
      - NODE_ENV=production
      - API_PORT=4000
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/postgres
      - SUPABASE_URL=http://gotrue:9999
      - SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      # 仅由 API 容器读取；严禁放入 web/public 或 NEXT_PUBLIC_ 变量。
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      # 仅餐食决策等需要推理的请求调用；库存、提醒和确认仍走本地确定性工具。
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:?MINIMAX_API_KEY is required}
      - MINIMAX_AGENT_MODEL=${MINIMAX_AGENT_MODEL:-abab6.5s-chat}
      - MINIMAX_AGENT_TIMEOUT_MS=${MINIMAX_AGENT_TIMEOUT_MS:-5500}
    cpus: 0.75
    mem_limit: 1g
    depends_on:
      - db
      - gotrue

volumes:
  xz-db-data:
